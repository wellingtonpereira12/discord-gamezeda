name: Deploy Automático na VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Sincronizar e Compilar na VPS
    runs-on: ubuntu-latest
    steps:
      - name: Conectar via SSH e Atualizar Container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            echo "🚀 [CI/CD] Iniciando atualização automática na VPS..."
            cd /root/discord-gamezeda
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            docker compose up -d --build
            docker ps --filter "name=discord-gamezeda"
            echo "✅ [CI/CD] Deploy e compilação concluídos com sucesso!"

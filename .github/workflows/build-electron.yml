name: Compilar Executável Windows (FakeDC PC)

on:
  push:
    branches:
      - main
    paths:
      - 'electron/**'
      - 'package.json'
      - '.github/workflows/build-electron.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-electron:
    name: Build Electron Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências
        run: npm install

      - name: Extrair Versão do package.json
        id: pkg_version
        shell: pwsh
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          echo "VERSION=$($pkg.version)" >> $env:GITHUB_OUTPUT
          Write-Host "Versão do build: $($pkg.version)"

      - name: Compilar Instalador Windows com Electron Builder
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Duplicar Executável para Compatibilidade Retroativa
        shell: pwsh
        run: |
          if (Test-Path dist/FakeDC-Setup.exe) {
            Copy-Item dist/FakeDC-Setup.exe dist/Jogos-Bolados-Setup.exe -Force
            Write-Host "FakeDC-Setup.exe duplicado como Jogos-Bolados-Setup.exe com sucesso!"
          }

      - name: Listar Arquivos Compilados em dist
        shell: pwsh
        run: |
          Get-ChildItem -Path dist -Force

      - name: Fazer Upload do Artefato no GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: FakeDC-Windows-Setup-v${{ steps.pkg_version.outputs.VERSION }}
          path: dist/*.exe
          retention-days: 30

      - name: Criar ou Atualizar Release no GitHub com Executável
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v${{ steps.pkg_version.outputs.VERSION }}
          name: FakeDC Desktop v${{ steps.pkg_version.outputs.VERSION }}
          body: |
            🎮 **FakeDC para PC (Windows)**
            
            - **Versão:** v${{ steps.pkg_version.outputs.VERSION }}
            - **Instalador:** Executável 1-click gerado automaticamente pelo GitHub Actions.
            - **Recursos:**
              - Voz e vídeo em alta definição com WebRTC e STUN/TURN.
              - Cancelamento de ruído baseado em rede neural (RNNoise).
              - Compartilhamento de tela HD estilo Discord (seletor de telas e janelas).
              - Auto-updater 100% silencioso e resiliente.
          files: |
            dist/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Atualizar Release desktop-latest no GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: desktop-latest
          name: FakeDC Desktop (Windows)
          body: |
            🎮 **FakeDC para PC (Windows) - Versão Mais Recente**
            
            - **Versão:** v${{ steps.pkg_version.outputs.VERSION }}
            - **Instalador:** Executável oficial FakeDC-Setup.exe e compatibilidade Jogos-Bolados-Setup.exe.
          files: |
            dist/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

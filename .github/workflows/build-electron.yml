name: Compilar Executável Windows (FakeDC PC)

on:
  push:
    branches:
      - main
    paths:
      - 'electron/**'
      - 'package.json'
      - '.github/workflows/build-electron.yml'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Tipo de incremento de versão (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      custom_version:
        description: 'Versão customizada explícita (opcional, ex: 1.7.0 - ignora o tipo se preenchida)'
        required: false
        default: ''
        type: string
      release_notes:
        description: 'Notas de lançamento da versão (opcional)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: write

jobs:
  build-electron:
    name: Build Electron Windows (.exe)
    runs-on: windows-latest
    if: "!contains(github.event.head_commit.message, '[skip electron]')"

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências
        run: npm install

      - name: Incrementar e Sincronizar Versão
        id: pkg_version
        shell: pwsh
        env:
          INPUT_BUMP_TYPE: ${{ github.event.inputs.bump_type }}
          INPUT_CUSTOM_VERSION: ${{ github.event.inputs.custom_version }}
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          $target = "patch"
          if ($env:INPUT_CUSTOM_VERSION -and $env:INPUT_CUSTOM_VERSION.Trim() -ne "") {
            $target = $env:INPUT_CUSTOM_VERSION.Trim()
          } elseif ($env:INPUT_BUMP_TYPE -and $env:INPUT_BUMP_TYPE.Trim() -ne "") {
            $target = $env:INPUT_BUMP_TYPE.Trim()
          }
          Write-Host "Executando bump de versão com alvo: $target"
          node scripts/bump-version.cjs $target

      - name: Compilar Instalador Windows com Electron Builder
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Duplicar Executável para Compatibilidade Retroativa
        shell: pwsh
        run: |
          if (Test-Path dist/FakeDC-Setup.exe) {
            Copy-Item dist/FakeDC-Setup.exe dist/Jogos-Bolados-Setup.exe -Force
            Write-Host "FakeDC-Setup.exe duplicado como Jogos-Bolados-Setup.exe com sucesso!"
          }

      - name: Listar Arquivos Compilados em dist
        shell: pwsh
        run: |
          Get-ChildItem -Path dist -Force

      - name: Fazer Upload do Artefato no GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: FakeDC-Windows-Setup-v${{ steps.pkg_version.outputs.VERSION }}
          path: dist/*.exe
          retention-days: 30

      - name: Criar ou Atualizar Release no GitHub com Executável
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v${{ steps.pkg_version.outputs.VERSION }}
          name: FakeDC Desktop v${{ steps.pkg_version.outputs.VERSION }}
          body: |
            🎮 **FakeDC para PC (Windows)**
            
            - **Versão:** v${{ steps.pkg_version.outputs.VERSION }}
            - **Instalador:** Executável 1-click gerado automaticamente pelo GitHub Actions.
            - **Recursos:**
              - Voz e vídeo em alta definição com WebRTC e STUN/TURN.
              - Cancelamento de ruído baseado em rede neural (RNNoise).
              - Compartilhamento de tela HD estilo Discord (seletor de telas e janelas).
              - Auto-updater 100% silencioso e resiliente.
          files: |
            dist/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Atualizar Release desktop-latest no GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: desktop-latest
          name: FakeDC Desktop (Windows)
          body: |
            🎮 **FakeDC para PC (Windows) - Versão Mais Recente**
            
            - **Versão:** v${{ steps.pkg_version.outputs.VERSION }}
            - **Instalador:** Executável oficial FakeDC-Setup.exe e compatibilidade Jogos-Bolados-Setup.exe.
          files: |
            dist/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Git e Salvar Nova Versão no Repositório
        if: startsWith(github.ref, 'refs/heads/main')
        shell: pwsh
        env:
          VERSION: ${{ steps.pkg_version.outputs.VERSION }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json electron/package.json public/version.json public/index.html public/app.js electron/main.js
          $status = git status --porcelain
          if ($status) {
            Write-Host "Comitando nova versão v$env:VERSION no repositório..."
            git commit -m "chore(release): v$env:VERSION [skip electron]"
            git push origin main
          } else {
            Write-Host "Nenhum arquivo de versão modificado para comitar."
          }

      - name: Acionar Deploy Automático na VPS com Nova Versão
        if: startsWith(github.ref, 'refs/heads/main')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Write-Host "Disparando pipeline de deploy na VPS para sincronizar versão e instalador..."
          gh workflow run deploy.yml || true

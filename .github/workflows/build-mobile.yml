name: Build Mobile App (Jogos Bolados Expo)

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/build-mobile.yml'
  workflow_dispatch:

jobs:
  mobile-check:
    name: Validar Projeto Expo Mobile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'mobile/package.json'

      - name: Instalar Dependências do Mobile
        working-directory: ./mobile
        run: npm install

      - name: Validar Configuração Expo
        working-directory: ./mobile
        run: npx expo-doctor || true

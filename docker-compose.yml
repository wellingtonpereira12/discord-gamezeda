services:
  discord-gamezeda:
    build: .
    container_name: discord-gamezeda
    restart: always
    ports:
      - "3050:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=3000
      - TZ=America/Sao_Paulo
      - DB_HOST=host.docker.internal
      - DB_PORT=3306
      - DB_USER=discord_user
      - DB_PASSWORD=DiscordGamezeda2026!
      - DB_NAME=discord_gamezeda
    volumes:
      - discord-uploads:/app/public/uploads
      - ./public/downloads:/app/public/downloads
      - /etc/letsencrypt/live/jogosbolados.duckdns.org/fullchain.pem:/app/cert.pem:ro
      - /etc/letsencrypt/live/jogosbolados.duckdns.org/privkey.pem:/app/key.pem:ro
      - /etc/letsencrypt/archive:/etc/letsencrypt/archive:ro

volumes:
  discord-uploads:

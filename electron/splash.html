<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>FakeDC - Inicializador</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #2b2d31;
      color: #dbdee1;
      font-family: 'gg sans', 'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      position: relative;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
    }

    /* Barra Superior Minimalista */
    .titlebar {
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-left: 12px;
      -webkit-app-region: drag;
    }

    .titlebar-brand {
      font-size: 11px;
      font-weight: 600;
      color: #949ba4;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .titlebar-actions {
      -webkit-app-region: no-drag;
      display: flex;
      height: 100%;
    }

    .titlebar-btn {
      background: transparent;
      border: none;
      color: #949ba4;
      width: 38px;
      height: 100%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.12s ease, color 0.12s ease;
    }

    .titlebar-btn:hover {
      background-color: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }

    .titlebar-btn.close:hover {
      background-color: #ed4245;
      color: #ffffff;
    }

    /* Área Central */
    .splash-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px 36px 32px;
      text-align: center;
    }

    .logo-box {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      overflow: hidden;
      margin-bottom: 16px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      background-color: #1e1f22;
      flex-shrink: 0;
    }

    .logo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .app-title {
      font-size: 18px;
      font-weight: 600;
      color: #f2f3f5;
      margin-bottom: 2px;
    }

    .app-subtitle {
      font-size: 13px;
      color: #949ba4;
      font-weight: 400;
      margin-bottom: 22px;
    }

    /* Texto de Status */
    .status-text {
      font-size: 13px;
      font-weight: 500;
      color: #dbdee1;
      margin-bottom: 12px;
      min-height: 18px;
    }

    /* Barra de Progresso Minimalista */
    .progress-wrapper {
      width: 100%;
      margin-bottom: 8px;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: #1e1f22;
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #5865F2;
      border-radius: 3px;
      transition: width 0.2s ease-out;
    }

    .progress-bar.indeterminate {
      width: 100%;
      background: linear-gradient(90deg, rgba(88, 101, 242, 0.25) 0%, #5865F2 50%, rgba(88, 101, 242, 0.25) 100%);
      background-size: 200% 100%;
      animation: shimmer-indeterminate 1.5s infinite linear;
    }

    /* Metadados de Download */
    .progress-meta {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 500;
      color: #949ba4;
      margin-top: 6px;
    }

    .progress-meta-right {
      display: flex;
      gap: 8px;
    }

    .footer-version {
      position: absolute;
      bottom: 12px;
      font-size: 11px;
      color: #80848e;
    }

    @keyframes shimmer-indeterminate {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body>

  <!-- Barra de Título -->
  <div class="titlebar">
    <div class="titlebar-brand">
      <span>FakeDC PC</span>
    </div>
    <div class="titlebar-actions">
      <button class="titlebar-btn" id="btn-minimize" title="Minimizar">
        <svg width="10" height="10" viewBox="0 0 12 12">
          <rect fill="currentColor" width="10" height="1.1" x="1" y="5.5"></rect>
        </svg>
      </button>
      <button class="titlebar-btn close" id="btn-close" title="Fechar">
        <svg width="10" height="10" viewBox="0 0 12 12">
          <polygon fill="currentColor" points="11 1.7 10.3 1 6 5.3 1.7 1 1 1.7 5.3 6 1 10.3 1.7 11 6 6.7 10.3 11 11 10.3 6.7 6"></polygon>
        </svg>
      </button>
    </div>
  </div>

  <!-- Área Central -->
  <div class="splash-container">
    
    <div class="logo-box">
      <img src="assets/logo.png" class="logo-img" alt="FakeDC">
    </div>

    <h1 class="app-title">FakeDC</h1>
    <div class="app-subtitle">Central de Voz & Jogos</div>

    <div class="status-text" id="status-text">Verificando atualizações...</div>

    <!-- Barra de Progresso -->
    <div class="progress-wrapper">
      <div class="progress-track">
        <div class="progress-bar indeterminate" id="tube-progress"></div>
      </div>
      <div class="progress-meta" id="download-meta">
        <span id="label-percent">Aguardando...</span>
        <div class="progress-meta-right">
          <span id="label-bytes"></span>
          <span id="label-speed"></span>
        </div>
      </div>
    </div>

    <div class="footer-version" id="footer-version">Cliente Windows v1.0.0</div>

  </div>

  <script>
    const statusText = document.getElementById('status-text');
    const tubeProgress = document.getElementById('tube-progress');
    const labelPercent = document.getElementById('label-percent');
    const labelBytes = document.getElementById('label-bytes');
    const labelSpeed = document.getElementById('label-speed');
    const footerVersion = document.getElementById('footer-version');
    const btnMinimize = document.getElementById('btn-minimize');
    const btnClose = document.getElementById('btn-close');

    // Botões de controle da janela
    if (window.electronAPI) {
      btnMinimize.addEventListener('click', () => window.electronAPI.minimizeWindow());
      btnClose.addEventListener('click', () => window.electronAPI.closeWindow());

      window.electronAPI.getVersion().then(v => {
        if (v) footerVersion.textContent = `Cliente Windows v${v}`;
      });

      // Escuta status do updater
      window.electronAPI.onUpdaterStatus((data) => {
        if (!data) return;
        if (data.message) {
          statusText.textContent = data.message;
        }

        if (data.step === 'checking') {
          tubeProgress.classList.add('indeterminate');
          tubeProgress.style.width = '100%';
          labelPercent.textContent = 'Verificando versão...';
          labelBytes.textContent = '';
          labelSpeed.textContent = '';
        } else if (data.step === 'downloading') {
          tubeProgress.classList.remove('indeterminate');
          tubeProgress.style.width = '0%';
          labelPercent.textContent = 'Iniciando download...';
        } else if (data.step === 'installing') {
          tubeProgress.classList.remove('indeterminate');
          tubeProgress.style.width = '100%';
          labelPercent.textContent = 'Concluído (100%)';
          labelSpeed.textContent = 'Reiniciando...';
        } else if (data.step === 'up-to-date') {
          tubeProgress.classList.remove('indeterminate');
          tubeProgress.style.width = '100%';
          labelPercent.textContent = 'Pronto!';
          labelBytes.textContent = '';
          labelSpeed.textContent = '';
        }
      });

      // Escuta progresso do download do instalador
      window.electronAPI.onUpdaterProgress((prog) => {
        if (!prog) return;
        tubeProgress.classList.remove('indeterminate');
        const pct = Math.min(100, Math.max(0, prog.percent || 0));
        tubeProgress.style.width = pct + '%';
        labelPercent.textContent = pct + '%';

        if (prog.totalBytes > 0) {
          const recMB = (prog.receivedBytes / (1024 * 1024)).toFixed(1);
          const totMB = (prog.totalBytes / (1024 * 1024)).toFixed(1);
          labelBytes.textContent = `${recMB} MB / ${totMB} MB`;
        }

        if (prog.speedBytes > 0) {
          const speedMB = (prog.speedBytes / (1024 * 1024)).toFixed(1);
          labelSpeed.textContent = `${speedMB} MB/s`;
        }
      });
    }
  </script>
</body>
</html>

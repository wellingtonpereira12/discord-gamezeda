<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Jogos Bolados - Inicializador</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #2b2d31 0%, #1e1f22 60%, #111214 100%);
      color: #f2f3f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      position: relative;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
    }

    /* Barra Superior Arrastável */
    .titlebar {
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      -webkit-app-region: drag;
    }

    .titlebar-brand {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: #949ba4;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .titlebar-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #5865F2;
      box-shadow: 0 0 8px #5865F2;
    }

    .titlebar-actions {
      -webkit-app-region: no-drag;
      display: flex;
      gap: 4px;
    }

    .titlebar-btn {
      background: transparent;
      border: none;
      color: #949ba4;
      width: 24px;
      height: 24px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: background 0.15s, color 0.15s;
    }

    .titlebar-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .titlebar-btn.close:hover {
      background: #ed4245;
      color: #fff;
    }

    /* Conteúdo Central */
    .splash-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 32px 28px;
      text-align: center;
    }

    .logo-wrapper {
      position: relative;
      width: 84px;
      height: 84px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-aura {
      position: absolute;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(88, 101, 242, 0.4) 0%, rgba(88, 101, 242, 0) 70%);
      animation: pulse-aura 2.4s ease-in-out infinite;
    }

    .logo-box {
      position: relative;
      width: 78px;
      height: 78px;
      border-radius: 22px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.65);
      border: 2px solid rgba(255, 255, 255, 0.2);
    }

    .logo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .app-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: #fff;
      margin-bottom: 4px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
    }

    .app-subtitle {
      font-size: 12px;
      color: #b5bac1;
      font-weight: 500;
      margin-bottom: 22px;
    }

    /* Status Text */
    .status-text {
      font-size: 13px;
      font-weight: 600;
      color: #dbdee1;
      margin-bottom: 12px;
      min-height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: color 0.2s;
    }

    /* O TUBINHO DE DOWNLOAD (Barra de Progresso Estilizada) */
    .tube-wrapper {
      width: 100%;
      margin-bottom: 10px;
    }

    .download-tube {
      position: relative;
      width: 100%;
      height: 12px;
      background: #111214;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 2px;
      overflow: hidden;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.8), 0 0 10px rgba(88, 101, 242, 0.15);
    }

    .tube-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #5865F2, #00b0f4, #57F287);
      background-size: 200% 100%;
      border-radius: 8px;
      transition: width 0.25s ease-out;
      box-shadow: 0 0 10px rgba(88, 101, 242, 0.8);
      position: relative;
    }

    .tube-fill.shimmer {
      width: 100%;
      background: linear-gradient(90deg, rgba(88,101,242,0.2) 0%, rgba(88,101,242,0.8) 50%, rgba(88,101,242,0.2) 100%);
      background-size: 200% 100%;
      animation: shimmer-indeterminate 1.6s infinite linear;
    }

    /* Detalhes de Download (%, MBs e Velocidade) */
    .download-meta {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 600;
      color: #949ba4;
      margin-top: 4px;
    }

    .download-meta-right {
      display: flex;
      gap: 8px;
    }

    .footer-version {
      position: absolute;
      bottom: 10px;
      font-size: 10.5px;
      color: #80848e;
      letter-spacing: 0.3px;
    }

    @keyframes pulse-aura {
      0% { transform: scale(0.92); opacity: 0.4; }
      50% { transform: scale(1.15); opacity: 0.85; }
      100% { transform: scale(0.92); opacity: 0.4; }
    }

    @keyframes shimmer-indeterminate {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
  </style>
</head>
<body>

  <!-- Barra de Título -->
  <div class="titlebar">
    <div class="titlebar-brand">
      <img src="assets/logo.png" style="width: 16px; height: 16px; border-radius: 50%; object-fit: cover;" alt="">
      <span>Jogos Bolados PC</span>
    </div>
    <div class="titlebar-actions">
      <button class="titlebar-btn" id="btn-minimize" title="Minimizar">&#8211;</button>
      <button class="titlebar-btn close" id="btn-close" title="Fechar">&times;</button>
    </div>
  </div>

  <!-- Área Central -->
  <div class="splash-container">
    
    <div class="logo-wrapper">
      <div class="logo-aura"></div>
      <div class="logo-box">
        <img src="assets/logo.png" class="logo-img" alt="Jogos Bolados">
      </div>
    </div>

    <h1 class="app-title">Jogos Bolados</h1>
    <div class="app-subtitle">Central de Voz & Jogos</div>

    <div class="status-text" id="status-text">Verificando atualizações no servidor...</div>

    <!-- Tubinho de Download -->
    <div class="tube-wrapper">
      <div class="download-tube">
        <div class="tube-fill shimmer" id="tube-progress"></div>
      </div>
      <div class="download-meta" id="download-meta">
        <span id="label-percent">Aguardando...</span>
        <div class="download-meta-right">
          <span id="label-bytes"></span>
          <span id="label-speed" style="color: #57F287;"></span>
        </div>
      </div>
    </div>

    <div class="footer-version" id="footer-version">Cliente Windows v1.0.0</div>

  </div>

  <script>
    const statusText = document.getElementById('status-text');
    const tubeProgress = document.getElementById('tube-progress');
    const labelPercent = document.getElementById('label-percent');
    const labelBytes = document.getElementById('label-bytes');
    const labelSpeed = document.getElementById('label-speed');
    const footerVersion = document.getElementById('footer-version');
    const btnMinimize = document.getElementById('btn-minimize');
    const btnClose = document.getElementById('btn-close');

    // Botões de controle da janela
    if (window.electronAPI) {
      btnMinimize.addEventListener('click', () => window.electronAPI.minimizeWindow());
      btnClose.addEventListener('click', () => window.electronAPI.closeWindow());

      window.electronAPI.getVersion().then(v => {
        if (v) footerVersion.textContent = `Cliente Windows v${v}`;
      });

      // Escuta status do updater
      window.electronAPI.onUpdaterStatus((data) => {
        if (!data) return;
        if (data.message) {
          statusText.textContent = data.message;
        }

        if (data.step === 'checking') {
          tubeProgress.classList.add('shimmer');
          tubeProgress.style.width = '100%';
          labelPercent.textContent = 'Verificando versão...';
          labelBytes.textContent = '';
          labelSpeed.textContent = '';
        } else if (data.step === 'downloading') {
          tubeProgress.classList.remove('shimmer');
          tubeProgress.style.width = '0%';
          labelPercent.textContent = 'Iniciando download...';
        } else if (data.step === 'installing') {
          tubeProgress.classList.remove('shimmer');
          tubeProgress.style.width = '100%';
          labelPercent.textContent = 'Concluído (100%)';
          labelSpeed.textContent = 'Reiniciando...';
        } else if (data.step === 'up-to-date') {
          tubeProgress.classList.remove('shimmer');
          tubeProgress.style.width = '100%';
          labelPercent.textContent = 'Pronto!';
          labelBytes.textContent = '';
          labelSpeed.textContent = '';
        }
      });

      // Escuta progresso do download do instalador
      window.electronAPI.onUpdaterProgress((prog) => {
        if (!prog) return;
        tubeProgress.classList.remove('shimmer');
        const pct = Math.min(100, Math.max(0, prog.percent || 0));
        tubeProgress.style.width = pct + '%';
        labelPercent.textContent = pct + '%';

        if (prog.totalBytes > 0) {
          const recMB = (prog.receivedBytes / (1024 * 1024)).toFixed(1);
          const totMB = (prog.totalBytes / (1024 * 1024)).toFixed(1);
          labelBytes.textContent = `${recMB} MB / ${totMB} MB`;
        }

        if (prog.speedBytes > 0) {
          const speedMB = (prog.speedBytes / (1024 * 1024)).toFixed(1);
          labelSpeed.textContent = `${speedMB} MB/s`;
        }
      });
    }
  </script>
</body>
</html>
